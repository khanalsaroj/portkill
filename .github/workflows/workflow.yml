name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - ".golangci.yml"
      - "main/install.sh"
      - "main/install.ps1"
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Guard the release behind a green test run.
      - name: Test
        run: go test ./...

      # Decide the bump from the latest commit (Conventional Commits).
      - name: Determine version bump
        id: bump
        run: |
          msg="$(git log -1 --pretty=%B | tr '[:upper:]' '[:lower:]')"
          echo "Last commit: $msg"
          if echo "$msg" | grep -qE '(^|\s)breaking change|!:'; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$msg" | grep -qE '^feat'; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          latest="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          ver="${latest#v}"
          IFS='.' read -r major minor patch <<< "$ver"
          case "$BUMP" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v${major}.$((minor + 1)).0" ;;
            patch) next="v${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Build & package
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="portkill"
          VPKG="github.com/khanalsaroj/portkill/internal/version"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X ${VPKG}.Version=${VERSION} -X ${VPKG}.Commit=${COMMIT} -X ${VPKG}.Date=${DATE}"

          build() {
            local os="$1" arch="$2" target="${1}-${2}"
            echo "==> building $target"
            if [ "$os" = "windows" ]; then
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" -o "dist/${BIN}.exe" ./cmd/portkill
              (cd dist && zip -q "${BIN}-${target}.zip" "${BIN}.exe" && rm "${BIN}.exe")
            else
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" -o "dist/${BIN}" ./cmd/portkill
              (cd dist && tar -czf "${BIN}-${target}.tar.gz" "${BIN}" && rm "${BIN}")
            fi
          }

          build linux   amd64
          build linux   arm64
          build linux   386
          build darwin  amd64
          build darwin  arm64
          build freebsd amd64
          build freebsd arm64
          build windows amd64
          build windows arm64
          build windows 386

          (cd dist && sha256sum * > checksums.txt)
          echo "Artifacts:"
          ls -lh dist/

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          prev="$(git tag --sort=-version:refname | head -1 || true)"
          range=""
          [ -n "$prev" ] && range="${prev}..HEAD"
          notes="docs/RELEASE_NOTES.md"
          mkdir -p docs
          {
            echo "## portkill ${VERSION}"
            echo ""
            section() {
              local title="$1" pattern="$2" body
              body="$(git log $range --pretty='- %s' | grep -iE "$pattern" || true)"
              [ -n "$body" ] && printf '### %s\n%s\n\n' "$title" "$body"
            }
            section "🚨 Breaking Changes" 'breaking change|!:'
            section "✨ Features" '^- feat'
            section "🐛 Bug Fixes" '^- fix'
            other="$(git log $range --pretty='- %s' | grep -ivE 'breaking change|!:|^- feat|^- fix' || true)"
            [ -n "$other" ] && printf '### 🔧 Other Changes\n%s\n' "$other"
          } > "$notes"
          cat "$notes"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: portkill ${{ steps.version.outputs.version }}
          body_path: docs/RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
